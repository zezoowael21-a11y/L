<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المفاجأة 🎁</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .ily-wrapper {
      animation: fadeInUp 0.7s ease both;
    }
    .heart-wrapper {
      animation: fadeInUp 0.9s ease both;
    }
    .gallery-section {
      animation: fadeInUp 1.1s ease both;
      width: 100%;
    }
    .gallery-note {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.45);
      margin-top: 0.6rem;
    }

    /* ===== Card style photos ===== */
    .cards-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0;
      width: 100%;
      padding: 1.5rem 1.5rem 2rem;
      position: relative;
      overflow: visible;
    }

    .photo-card {
      width: 28vw;
      max-width: 150px;
      min-width: 85px;
      height: 37vw;
      max-height: 200px;
      min-height: 115px;
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 10px 35px rgba(0,0,0,0.4);
      transition: transform 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }

    /* middle card slightly bigger */
    .photo-card:nth-child(2) {
      width: 32vw;
      max-width: 170px;
      min-width: 100px;
      height: 42vw;
      max-height: 220px;
      min-height: 135px;
      z-index: 2;
      border-color: rgba(255,150,200,0.5);
      box-shadow: 0 16px 50px rgba(255,100,180,0.4);
    }

    /* left card tilted left */
    .photo-card:nth-child(1) {
      transform: rotate(-8deg) translateX(10px);
      z-index: 1;
    }
    .photo-card:nth-child(1):hover {
      transform: rotate(-4deg) translateX(5px) translateY(-8px);
    }

    /* middle card straight */
    .photo-card:nth-child(2):hover {
      transform: translateY(-10px) scale(1.04);
    }

    /* right card tilted right */
    .photo-card:nth-child(3) {
      transform: rotate(8deg) translateX(-10px);
      z-index: 1;
    }
    .photo-card:nth-child(3):hover {
      transform: rotate(4deg) translateX(-5px) translateY(-8px);
    }

    .photo-card input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      z-index: 3;
    }

    .photo-card .card-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(255,255,255,0.4);
      font-size: 2.2rem;
      gap: 0.4rem;
    }

    .photo-card .card-placeholder span {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
    }

    .photo-card img.preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* منع الكارت الرئيسي من يقص الكروت */
    .glass-card-dark {
      overflow: visible !important;
    }
    .back-btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.6rem 1.8rem;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* hidden file input for adding new slots */
    #addFileInput {
      display: none;
    }
  </style>
</head>
<body class="bg-dark" data-page="surprise">

  <!-- Stars -->
  <div class="stars"></div>
  <!-- Floating hearts -->
  <div class="hearts-container"></div>

  <div class="page-container">
    <div class="glass-card-dark">

      <!-- I love you title -->
      <div class="ily-wrapper">
        <h1 class="ily-title">i love u loltyyy ❤️</h1>
      </div>

      <!-- Beating heart removed -->

      <!-- Photo cards -->
      <div class="gallery-section">
        <div class="cards-row" id="cardsRow">

          <!-- Card 1 - left -->
          <div class="photo-card">
            <img src="images/WhatsApp Image 2026-10-22 at 1.58.46 PM (1).jpeg" class="preview" onerror="this.style.display='none'" />
            <input type="file" accept="image/*" />
            <div class="card-placeholder">
              🌸
              <span>صورة</span>
            </div>
          </div>

          <!-- Card 2 - middle -->
          <div class="photo-card">
            <img src="images/WhatsApp Image 2026-10-22 at 1.58.46 PM.jpeg" class="preview" onerror="this.style.display='none'" />
            <input type="file" accept="image/*" />
            <div class="card-placeholder">
              💕
              <span>صورة</span>
            </div>
          </div>

          <!-- Card 3 - right -->
          <div class="photo-card">
            <img src="images/WhatsApp Image 2026-10-22 at 1.59.06 PM.jpeg" class="preview" onerror="this.style.display='none'" />
            <input type="file" accept="image/*" />
            <div class="card-placeholder">
              ✨
              <span>صورة</span>
            </div>
          </div>

        </div>
      </div>

      <a href="index.html" class="back-btn">← رجّعيني للأول</a>

    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // Photo card preview
    document.querySelectorAll('.photo-card').forEach(card => {
      const input = card.querySelector('input[type="file"]');
      input.addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          let img = card.querySelector('img.preview');
          if (!img) {
            img = document.createElement('img');
            img.classList.add('preview');
            card.appendChild(img);
            const placeholder = card.querySelector('.card-placeholder');
            if (placeholder) placeholder.style.display = 'none';
          }
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    });
  </script>
</body>
</html>
